name: Build and Release

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build project
        run: ./gradlew clean build shadowJar
      
      - name: Get version from build.gradle.kts
        id: get_version
        run: |
          VERSION=$(grep -m 1 "version = " build.gradle.kts | sed 's/.*version = "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Find JAR files
        id: find_jars
        run: |
          BUNGEE_JAR=$(find bungee/build/libs -name "NanoLimboPluginPlus-bungee.jar" -type f | head -1)
          VELOCITY_JAR=$(find velocity/build/libs -name "NanoLimboPluginPlus-velocity.jar" -type f | head -1)
          
          if [ -z "$BUNGEE_JAR" ] || [ -z "$VELOCITY_JAR" ]; then
            echo "Error: JAR files not found"
            echo "Bungee JAR: $BUNGEE_JAR"
            echo "Velocity JAR: $VELOCITY_JAR"
            exit 1
          fi
          
          echo "bungee_jar=$BUNGEE_JAR" >> $GITHUB_OUTPUT
          echo "velocity_jar=$VELOCITY_JAR" >> $GITHUB_OUTPUT
          echo "Found Bungee JAR: $BUNGEE_JAR"
          echo "Found Velocity JAR: $VELOCITY_JAR"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: |
            ## Release v${{ steps.get_version.outputs.version }}
            
            ### Downloads
            - **Bungee**: `NanoLimboPluginPlus-bungee.jar`
            - **Velocity**: `NanoLimboPluginPlus-velocity.jar`
            
            ### Changes
            See commit history for details.
          files: |
            ${{ steps.find_jars.outputs.bungee_jar }}
            ${{ steps.find_jars.outputs.velocity_jar }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
